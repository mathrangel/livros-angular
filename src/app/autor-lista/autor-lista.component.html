<main class="container py-5">
  <div class="mb-4">
    <h1 class="mb-1">Autores</h1>
    <p class="text-muted mb-0">{{ autores.length }} autor(es) no catálogo</p>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let item of autores">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title d-flex align-items-center gap-2 mb-1">
            <i class="bi bi-person-circle text-muted"></i> {{ item.autor }}
          </h5>
          <p class="small text-muted mb-3">{{ item.livros.length }} livro(s)</p>
          <ul class="list-unstyled mb-0">
            <li class="d-flex justify-content-between align-items-center gap-2 py-2 border-top" *ngFor="let livro of item.livros">
              <span>
                <i class="bi text-warning" [ngClass]="isFavorito(livro.codigo) ? 'bi-star-fill' : 'bi-book'"></i>
                {{ livro.titulo }}
              </span>
              <span class="badge bg-secondary">{{ obterNome(livro.codEditora) }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center text-muted py-5" *ngIf="autores.length === 0">
    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
    Nenhum autor cadastrado.
  </div>
</main>
